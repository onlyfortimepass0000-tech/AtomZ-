<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9514">
<meta name="description" content="Your orders, payments and deliveries, simply organised. ATOMZ Order Desk works on your device without AI.">
<title>Order Desk · ATOMZ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23f07020'/%3E%3Cpath d='m11 28 9-17 9 17m-14-6h10' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<!-- STYLE -->
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<header class="topbar"><div style="display:flex; align-items:center; gap:8px;"><a class="brand" href="../../tools.html" aria-label="ATOMZ Tools home"><span class="brand-mark">a.</span><span>Order Desk<small>by ATOMZ</small></span></a><a href="../../tools.html" style="font-size:11px; color:#999; text-decoration:none; border:1px solid rgba(255,255,255,0.12); padding:3px 8px; border-radius:8px; display:inline-flex; align-items:center; gap:4px; font-weight:600;">← Tools</a></div><div class="shop"><span id="shop-name">Your shop</span><span class="sample-pill" id="sample-pill" hidden>Sample</span></div><button class="button primary add-top" data-action="new">+ New order</button></header>
<nav class="nav" aria-label="Main navigation"><button data-nav="today" class="active"><span class="nav-icon" data-icon="today"></span>Today<span id="today-count" class="count" hidden></span></button><button data-nav="orders"><span class="nav-icon" data-icon="orders"></span>Orders</button><button data-nav="overview"><span class="nav-icon" data-icon="chart"></span>Overview</button><button data-nav="settings"><span class="nav-icon" data-icon="settings"></span>Settings</button></nav>
<main><div class="notice error-notice" id="storage-warning" role="alert" hidden></div><div class="demo-line" id="demo-line" hidden><span>Explore a sample shop.</span><button data-action="switch">Use my own orders <span aria-hidden="true">→</span></button></div><div id="content" aria-live="off"><p class="empty">Opening your desk…</p></div></main>
<button class="button primary mobile-add" data-action="new" aria-label="New order">+ New order</button>
<dialog id="order-dialog" aria-labelledby="order-title"><form id="order-form"><div class="dialog-header"><h2 id="order-title">New order</h2><button type="button" class="icon-button" data-close="order-dialog" aria-label="Close order">×</button></div><div class="dialog-body"><input type="hidden" name="id"><div class="fields"><div class="field"><label for="customer">Customer name</label><input id="customer" name="customer" required maxlength="100" placeholder="e.g. Priya Nair" autocomplete="off"></div><div class="field"><label for="product">Order / product</label><input id="product" name="product" required maxlength="180" placeholder="e.g. Birthday cake · 1 kg" list="product-list" autocomplete="off"><datalist id="product-list"></datalist></div><div class="field"><label for="price">Price per item (₹)</label><input id="price" name="price" type="number" inputmode="decimal" min="0.01" max="10000000" step="0.01" required placeholder="1500"></div><div class="field"><label for="due">Delivery / pickup date</label><input id="due" name="due" type="date" required></div></div><details id="more-order"><summary>Payment, contact &amp; other details</summary><div class="fields"><div class="field"><label for="qty">Quantity</label><input id="qty" name="qty" type="number" inputmode="numeric" min="1" max="10000" step="1" value="1" required></div><div class="field"><label for="delivery">Delivery charge (₹)</label><input id="delivery" name="delivery" type="number" inputmode="decimal" min="0" max="10000000" step="0.01" value="0" required></div><div class="field"><label for="paid">Received so far (₹)</label><input id="paid" name="paid" type="number" inputmode="decimal" min="0" max="100000000000" step="0.01" value="0" required></div><div class="field"><label for="deposit">Booking deposit (%)</label><input id="deposit" name="deposit" type="number" inputmode="numeric" min="0" max="100" step="1" value="50" required></div><div class="field"><label for="status">Order stage</label><select id="status" name="status"><option value="enquiry">Enquiry</option><option value="quoted">Quoted</option><option value="booked">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="field"><label for="followup">Follow-up date</label><input id="followup" name="followup" type="date"></div><div class="field"><label for="handle">Instagram handle</label><input id="handle" name="handle" maxlength="31" pattern="@?[A-Za-z0-9_.]{1,30}" placeholder="@customer" autocapitalize="none"></div><div class="field"><label for="phone">WhatsApp number</label><input id="phone" name="phone" type="tel" maxlength="22" placeholder="+91…"></div><div class="field"><label for="cost">Your total cost (₹)</label><input id="cost" name="cost" type="number" inputmode="decimal" min="0" max="100000000000" step="0.01" placeholder="Optional · kept private"></div><div class="field full"><label for="notes">Customer notes</label><textarea id="notes" name="notes" maxlength="2000" rows="3" placeholder="Design, flavour, pickup time…"></textarea></div></div></details><div class="calculation" id="order-calculation"></div><p id="order-error" class="error" role="alert"></p></div><div class="dialog-footer"><button type="button" class="button" data-close="order-dialog">Close</button><button class="button primary" type="submit">Save order</button></div></form></dialog>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<dialog id="payment-dialog" class="small-dialog" aria-labelledby="payment-title"><form id="payment-form"><div class="dialog-header"><h2 id="payment-title">Record payment</h2><button type="button" class="icon-button" data-close="payment-dialog" aria-label="Close payment">×</button></div><div class="dialog-body"><p id="payment-context" class="muted"></p><div class="field"><label for="payment-amount">Amount received now (₹)</label><input id="payment-amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required></div><div id="payment-presets" class="actions"></div><label class="check-label" id="book-option"><input id="book-after-payment" type="checkbox"> Confirm this booking</label><p class="hint">Record a payment after checking that you received it.</p><p class="error" id="payment-error" role="alert"></p></div><div class="dialog-footer"><button type="button" class="button" data-close="payment-dialog">Close</button><button class="button primary">Save payment</button></div></form></dialog>
<dialog id="quote-dialog" aria-labelledby="quote-title"><div class="dialog-header"><h2 id="quote-title">Customer quote</h2><button class="icon-button" data-close="quote-dialog" aria-label="Close quote">×</button></div><div class="dialog-body" id="quote-preview"></div><div class="dialog-footer"><button class="button" data-action="quote-copy">Copy text</button><button class="button" data-action="quote-png">Save image</button><button class="button" data-action="quote-print">Print / PDF</button><button class="button primary" data-action="quote-sent">Mark quote sent</button></div></dialog>
<dialog id="message-dialog" aria-labelledby="message-title"><div class="dialog-header"><h2 id="message-title">Follow up</h2><button class="icon-button" data-close="message-dialog" aria-label="Close message">×</button></div><div class="dialog-body"><p id="message-caption" class="muted"></p><div class="field"><label for="message-text">Message</label><textarea id="message-text" rows="7"></textarea></div><div class="actions"><button class="button" data-action="message-copy">Copy message</button><a class="button" id="message-instagram" target="_blank" rel="noopener noreferrer" hidden>Instagram ↗</a><a class="button" id="message-whatsapp" target="_blank" rel="noopener noreferrer" hidden>WhatsApp ↗</a></div><p class="hint">You send the message in your chat.</p></div><div class="dialog-footer"><button class="button" data-action="snooze">Remind tomorrow</button><button class="button primary" data-action="message-done">Sent · remind in 2 days</button></div></dialog>
<dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-title"><div class="dialog-header"><h2 id="confirm-title">Confirm</h2></div><div class="dialog-body"><p id="confirm-text"></p></div><div class="dialog-footer"><button class="button" data-close="confirm-dialog">Go back</button><button class="button primary" id="confirm-yes">Continue</button></div></dialog>
<input type="file" id="restore-file" accept="application/json,.json" hidden><div class="toast" id="toast" role="status" hidden></div><div id="print-root"></div>
<!-- CORE -->
<!-- APP -->
<script>
document.addEventListener('mousedown', function(e) {
  var target = e.target.closest('button, .button');
  if (!target) return;
  var rect = target.getBoundingClientRect();
  var ripple = document.createElement('span');
  ripple.className = 'water-ripple';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  target.appendChild(ripple);
  setTimeout(function() { ripple.remove(); }, 600);
});
</script>
</body>
</html>
